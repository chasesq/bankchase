<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator — Full + History + Memory + Gamma Factorial</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --panel-start:#2c2f36;
      --panel-end:#141417;
      --btn:#e9eef6;
      --accent:#ff9f1c;
      --text:#0f1720;
      --muted:#9aa3b2;
      --op:#6b7280;
      --func:#7c5cff;
      --glass: rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,#eaf2ff 0%,var(--bg) 100%);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      color:var(--text);
      padding:18px;
    }

    .container {
      width:980px;
      max-width:98vw;
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:16px;
    }

    .calculator{
      background:linear-gradient(180deg,var(--panel-start),var(--panel-end));
      border-radius:14px;
      padding:14px;
      box-shadow:0 12px 36px rgba(15,23,36,0.25);
      min-height:540px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .side {
      background:linear-gradient(180deg,#ffffff, #f7f7fb);
      border-radius:12px;
      padding:12px;
      box-shadow:0 8px 20px rgba(15,23,36,0.06);
      height:540px;
      overflow:auto;
    }

    .top-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      color:var(--muted);
      font-size:14px;
    }

    .display{
      height:80px;
      background:var(--glass);
      border-radius:10px;
      color:#fff;
      font-size:28px;
      padding:12px 16px;
      text-align:right;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      margin-bottom:6px;
    }
    .display.small { font-size:20px; padding:8px 12px; height:56px; }

    .controls {
      display:flex;
      gap:8px;
      align-items:center;
    }
    .toggle-sci, .toggle-deg {
      background:transparent;
      border:1px solid rgba(255,255,255,0.06);
      color:var(--muted);
      padding:8px 10px;
      border-radius:8px;
      cursor:pointer;
    }

    .panel { display:grid; gap:8px; }

    .scientific {
      display:grid;
      grid-template-columns: repeat(8, 1fr);
      gap:8px;
      margin-bottom:6px;
      transition:all .18s ease;
    }
    .scientific.hidden { display:none; }

    .keys{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:10px;
    }

    .btn{
      background:var(--btn);
      border:0;
      border-radius:10px;
      padding:14px;
      font-size:18px;
      cursor:pointer;
      box-shadow:0 3px 0 rgba(0,0,0,0.06);
      transition:transform .06s ease, box-shadow .06s ease;
      user-select:none;
      color:#111827;
    }

    .btn:active{transform:translateY(2px); box-shadow:none}
    .btn.op{ background:linear-gradient(180deg,#eef1f6,#dde3ef); color:var(--op)}
    .btn.func{ background:linear-gradient(180deg,#f0eaff,#e8dcff); color:var(--func)}
    .btn.equals{ background:var(--accent); color:#fff; grid-column:4; grid-row:5 / span 1; font-weight:600;}
    .btn.wide{ grid-column:1 / span 2; }

    .small-btn{ padding:8px; font-size:14px; }

    .side h3 { margin:0 0 8px 0; font-size:16px; }
    .mem-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .mem-display { background:#fff; padding:8px 10px; border-radius:8px; flex:1; color:#111; box-shadow:0 1px 0 rgba(0,0,0,0.04); }
    .history-list { max-height:420px; overflow:auto; }
    .history-item { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:8px; border-radius:8px; background:linear-gradient(180deg,#fff,#fafafa); margin-bottom:6px; }
    .history-item button { margin-left:8px; padding:6px 8px; border-radius:6px; border:0; cursor:pointer; }

    @media (max-width:1000px){
      .container{ grid-template-columns: 1fr; }
      .side{ order:2; width:100%; height:auto; max-height:400px; }
      .calculator{ order:1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <main class="calculator" role="application" aria-label="Advanced Calculator">
      <div class="top-row">
        <div><strong>Advanced Calculator</strong></div>
        <div class="controls">
          <div id="status" aria-live="polite">Ready</div>
          <button id="toggleSci" class="toggle-sci" aria-pressed="false" title="Toggle scientific panel (z)">Scientific</button>
          <button id="toggleDeg" class="toggle-deg" aria-pressed="false" title="Toggle degrees/radians (d)">Deg</button>
          <button id="copyBtn" class="toggle-deg" title="Copy current display (c)">Copy</button>
        </div>
      </div>

      <div id="display" class="display" aria-live="polite">0</div>

      <div class="panel">
        <div id="scientificPanel" class="scientific hidden" aria-hidden="true">
          <button class="btn func" data-func="sin">sin</button>
          <button class="btn func" data-func="cos">cos</button>
          <button class="btn func" data-func="tan">tan</button>
          <button class="btn func" data-func="asin">asin</button>
          <button class="btn func" data-func="acos">acos</button>
          <button class="btn func" data-func="atan">atan</button>
          <button class="btn func" data-func="sinh">sinh</button>
          <button class="btn func" data-func="cosh">cosh</button>

          <button class="btn func" data-func="tanh">tanh</button>
          <button class="btn func" data-func="asinh">asinh</button>
          <button class="btn func" data-func="acosh">acosh</button>
          <button class="btn func" data-func="atanh">atanh</button>
          <button class="btn func" data-func="sqrt">√</button>
          <button class="btn func" data-func="ln">ln</button>
          <button class="btn func" data-func="log10">log</button>
          <button class="btn func" data-func="abs">abs</button>

          <button class="btn func small-btn" data-action="pow2">x²</button>
          <button class="btn func small-btn" data-action="exp">exp</button>
          <button class="btn func small-btn" data-action="fact">x!</button>
          <button class="btn func small-btn" data-action="ans">Ans</button>
          <button class="btn func small-btn" data-action="const" data-value="pi">π</button>
          <button class="btn func small-btn" data-action="const" data-value="e">e</button>
          <button class="btn func small-btn" data-value="(">(
          </button>
          <button class="btn func small-btn" data-value=")">)</button>
        </div>

        <div class="keys" role="group" aria-label="Calculator keys">
          <button class="btn op" data-action="clear">C</button>
          <button class="btn op" data-action="back">⌫</button>
          <button class="btn op" data-value="%" aria-label="Percent">%</button>
          <button class="btn op" data-value="÷" aria-label="Divide">÷</button>

          <button class="btn" data-value="7">7</button>
          <button class="btn" data-value="8">8</button>
          <button class="btn" data-value="9">9</button>
          <button class="btn op" data-value="×" aria-label="Multiply">×</button>

          <button class="btn" data-value="4">4</button>
          <button class="btn" data-value="5">5</button>
          <button class="btn" data-value="6">6</button>
          <button class="btn op" data-value="-" aria-label="Minus">−</button>

          <button class="btn" data-value="1">1</button>
          <button class="btn" data-value="2">2</button>
          <button class="btn" data-value="3">3</button>
          <button class="btn op" data-value="+" aria-label="Plus">+</button>

          <button class="btn wide" data-value="0">0</button>
          <button class="btn" data-value=".">.</button>
          <button class="btn equals" data-action="equals" aria-label="Equals">=</button>
        </div>
      </div>
    </main>

    <aside class="side" aria-label="History and Memory">
      <h3>Memory</h3>
      <div class="mem-row">
        <div id="memDisplay" class="mem-display">0</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <button id="mPlus" class="btn small-btn" title="M+ (Shift+M)">M+</button>
          <button id="mMinus" class="btn small-btn" title="M- (Ctrl+M)">M-</button>
          <button id="mRecall" class="btn small-btn" title="MR (m)">MR</button>
          <button id="mClear" class="btn small-btn" title="MC (Alt+M)">MC</button>
        </div>
      </div>

      <h3 style="margin-top:12px;">History <button id="clearHistory" style="margin-left:8px;padding:6px;border-radius:6px;border:0;cursor:pointer;">Clear</button></h3>
      <div class="history-list" id="historyList" aria-live="polite"></div>
      <p style="color:var(--muted);font-size:13px;margin-top:10px;">
        Keyboard shortcuts: Enter=Eval, Backspace=⌫, Esc=Clear, z=Scientific, d=Deg/Rad, h=Toggle history, c=Copy display, m/M/Ctrl/Alt+M=Memory
      </p>
    </aside>
  </div>

  <script>
  (function(){
    // UI elements
    const displayEl = document.getElementById('display');
    const statusEl = document.getElementById('status');
    const sciPanel = document.getElementById('scientificPanel');
    const toggleSci = document.getElementById('toggleSci');
    const toggleDeg = document.getElementById('toggleDeg');
    const copyBtn = document.getElementById('copyBtn');

    const memDisplay = document.getElementById('memDisplay');
    const mPlusBtn = document.getElementById('mPlus');
    const mMinusBtn = document.getElementById('mMinus');
    const mRecallBtn = document.getElementById('mRecall');
    const mClearBtn = document.getElementById('mClear');

    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistory');

    // State
    let buffer = '';
    let lastAnswer = null;
    let memory = 0;
    let degMode = false;
    let implicitMultiplication = true;
    const history = []; // {expr, result}
    const maxHistory = 200;

    // Utilities
    function setStatus(msg, isError=false) {
      statusEl.textContent = msg;
      statusEl.style.color = isError ? '#ff6b6b' : '';
    }
    function updateDisplay() {
      displayEl.textContent = buffer === '' ? '0' : buffer;
      displayEl.classList.toggle('small', displayEl.textContent.length > 20);
    }
    function updateMemoryUI() {
      memDisplay.textContent = Number.isFinite(memory) ? String(memory) : String(memory);
    }
    function addHistory(expr, result) {
      history.unshift({expr, result});
      if (history.length > maxHistory) history.pop();
      renderHistory();
    }
    function renderHistory() {
      historyList.innerHTML = '';
      history.forEach((h, idx) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const left = document.createElement('div');
        left.style.flex = '1';
        left.innerHTML = '<div style="font-size:13px;color:#444">'+escapeHtml(h.expr)+'</div><div style="font-weight:600">'+escapeHtml(String(h.result))+'</div>';
        const right = document.createElement('div');
        const cp = document.createElement('button');
        cp.textContent = 'Copy';
        cp.addEventListener('click', () => navigator.clipboard.writeText(String(h.result)));
        const use = document.createElement('button');
        use.textContent = 'Use';
        use.addEventListener('click', () => { buffer = String(h.result); updateDisplay(); });
        right.appendChild(cp);
        right.appendChild(use);
        div.appendChild(left);
        div.appendChild(right);
        historyList.appendChild(div);
      });
    }
    function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // Append value with simple rules
    function appendValue(val) {
      if (buffer === '0' && val === '0') return;
      if (buffer === '0' && /[0-9]/.test(val)) { buffer = val; updateDisplay(); return; }
      buffer += val;
      updateDisplay();
    }

    function applyOperator(op) {
      if (!buffer && (op === '+' || op === '−' || op === '×' || op === '÷')) {
        if (op === '−') { buffer = '-'; updateDisplay(); }
        return;
      }
      const last = buffer[buffer.length - 1];
      if (last && /[+\-×÷%−\^*!]/.test(last)) {
        if (op === '−' && !/[)%]/.test(last)) buffer += op;
        else buffer = buffer.slice(0, -1) + op;
      } else buffer += op;
      updateDisplay();
    }
    function backspace() { buffer = buffer.slice(0, -1); updateDisplay(); }
    function clearAll() { buffer = ''; setStatus('Ready'); updateDisplay(); }

    function toggleNegate() {
      if (!buffer) { buffer = '-'; updateDisplay(); return; }
      // simple: wrap last number or expression
      let i = buffer.length - 1;
      if (buffer[i] === ')') {
        let depth = 0;
        while (i >= 0) {
          if (buffer[i] === ')') depth++;
          else if (buffer[i] === '(') { depth--; if (depth === 0) break; }
          i--;
        }
        const start = i;
        if (start >= 0) buffer = buffer.slice(0, start) + '(-1*' + buffer.slice(start) + ')';
        else buffer = '(-1*' + buffer + ')';
        updateDisplay(); return;
      }
      while (i >= 0 && /[0-9.eπ]/.test(buffer[i])) i--;
      const start = i + 1;
      if (start === 0) {
        if (buffer[0] === '-') buffer = buffer.slice(1);
        else buffer = '-' + buffer;
      } else {
        if (buffer[start - 1] === '-') {
          const prev = start - 2;
          if (prev < 0 || /[+\-×÷\^/(]/.test(buffer[prev])) buffer = buffer.slice(0, start - 1) + buffer.slice(start);
          else buffer = buffer.slice(0, start) + '(-' + buffer.slice(start) + ')';
        } else buffer = buffer.slice(0, start) + '(-' + buffer.slice(start) + ')';
      }
      updateDisplay();
    }

    // Tokenizer and parser with many features
    function rawTokenize(expr) {
      expr = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/π/g, 'π');
      const tokens = [];
      let i = 0;
      while (i < expr.length) {
        const ch = expr[i];
        if (ch === ' ') { i++; continue; }
        if (/\d|\./.test(ch)) {
          let num = ch; i++;
          while (i < expr.length && /[\d.]/.test(expr[i])) num += expr[i++];
          if ((num.match(/\./g) || []).length > 1) throw new Error('Invalid number format: multiple decimal points');
          tokens.push({ type:'number', value: parseFloat(num), raw: num }); continue;
        }
        if (ch === 'π') { tokens.push({ type:'number', value: Math.PI, raw: 'π' }); i++; continue; }
        if (ch === 'e') { tokens.push({ type:'number', value: Math.E, raw: 'e' }); i++; continue; }
        if (/[a-zA-Z]/.test(ch)) {
          let name = ch; i++;
          while (i < expr.length && /[a-zA-Z0-9]/.test(expr[i])) name += expr[i++];
          tokens.push({ type:'func', value: name.toLowerCase() }); continue;
        }
        if (ch === '+' || ch === '-' || ch === '*' || ch === '/' || ch === '^' || ch === '%' || ch === '!') {
          if (ch === '-') {
            const prev = tokens.length ? tokens[tokens.length -1] : null;
            if (!prev || (prev.type === 'operator' && prev.value !== '%') || (prev.type === 'paren' && prev.value === '(') || prev.type === 'func') {
              tokens.push({ type:'operator', value: 'u-' }); i++; continue;
            }
          }
          tokens.push({ type:'operator', value: ch }); i++; continue;
        }
        if (ch === '(' || ch === ')') { tokens.push({ type:'paren', value: ch }); i++; continue; }
        throw new Error('Invalid character: ' + ch);
      }
      return tokens;
    }

    function insertImplicitMultiplication(tokens) {
      if (!implicitMultiplication) return tokens;
      const out = [];
      for (let i=0;i<tokens.length;i++) {
        const cur = tokens[i];
        out.push(cur);
        const next = tokens[i+1];
        if (!next) continue;
        const curIsNumber = cur.type === 'number';
        const curIsRightParen = cur.type === 'paren' && cur.value === ')';
        const curIsPostfix = cur.type === 'operator' && (cur.value === '%' || cur.value === '!');
        const nextIsNumber = next.type === 'number';
        const nextIsFunc = next.type === 'func';
        const nextIsLeftParen = next.type === 'paren' && next.value === '(';
        if ((curIsNumber || curIsRightParen || curIsPostfix) && (nextIsFunc || nextIsNumber || nextIsLeftParen)) {
          out.push({ type:'operator', value: '*' });
        }
        // also between func and left paren we keep as func( so no insertion
        // also between number and func like 2sin -> insert *
      }
      return out;
    }

    function setPercentModes(tokens) {
      for (let i=0;i<tokens.length;i++) {
        const t = tokens[i];
        if (t.type === 'operator' && t.value === '%') {
          let mode = 'absolute';
          for (let j=i-1;j>=0;j--) {
            const p = tokens[j];
            if (p.type === 'operator' && p.value !== 'u-' && p.value !== '%' && p.value !== '!') {
              if (p.value === '+' || p.value === '-') mode = 'relative';
              else mode = 'absolute';
              break;
            }
            if (p.type === 'number' || p.type === 'func') break;
          }
          t.mode = mode;
        }
      }
    }

    function shuntingYard(tokens) {
      const output = []; const ops = [];
      const prec = { 'u-': 7, '!':7, '%':7, '^':6, '*':5, '/':5, '+':4, '-':4 };
      const assoc = { 'u-':'right', '!':'left', '%':'left', '^':'right', '*':'left', '/':'left', '+':'left', '-':'left' };

      for (let i=0;i<tokens.length;i++){
        const t = tokens[i];
        if (t.type === 'number') output.push(t);
        else if (t.type === 'func') ops.push(t);
        else if (t.type === 'operator') {
          const o1 = t.value;
          while (ops.length) {
            const top = ops[ops.length-1];
            if (top.type === 'operator') {
              const o2 = top.value;
              if ((assoc[o1] === 'left' && prec[o1] <= prec[o2]) || (assoc[o1] === 'right' && prec[o1] < prec[o2])) { output.push(ops.pop()); continue; }
            } else if (top.type === 'func') { output.push(ops.pop()); continue; }
            break;
          }
          ops.push(t);
        } else if (t.type === 'paren') {
          if (t.value === '(') ops.push(t);
          else {
            let found=false;
            while (ops.length) {
              const top = ops.pop();
              if (top.type === 'paren' && top.value === '(') { found=true; break; }
              output.push(top);
            }
            if (!found) throw new Error('Mismatched parentheses');
            if (ops.length && ops[ops.length-1].type === 'func') output.push(ops.pop());
          }
        }
      }
      while (ops.length) {
        const top = ops.pop();
        if (top.type === 'paren') throw new Error('Mismatched parentheses');
        output.push(top);
      }
      return output;
    }

    // Gamma (Lanczos) for non-integer factorial
    function gamma(z) {
      // Lanczos approximation
      const p = [
        676.5203681218851, -1259.1392167224028,
        771.32342877765313, -176.61502916214059,
        12.507343278686905, -0.13857109526572012,
        9.9843695780195716e-6, 1.5056327351493116e-7
      ];
      if (z < 0.5) {
        // reflection
        return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
      } else {
        z -= 1;
        let x = 0.99999999999980993;
        for (let i=0;i<p.length;i++) x += p[i]/(z+i+1);
        const t = z + p.length - 0.5;
        return Math.sqrt(2*Math.PI) * Math.pow(t, z+0.5) * Math.exp(-t) * x;
      }
    }

    function factorialValue(a) {
      if (a < 0) throw new Error('Factorial: negative');
      // integer small range -> iterative
      if (Math.abs(a - Math.round(a)) < 1e-12) {
        const n = Math.round(a);
        if (n > 170) throw new Error('Factorial overflow');
        let r = 1;
        for (let i=2;i<=n;i++) r *= i;
        return r;
      }
      // non-integer -> gamma(a+1)
      return gamma(a + 1);
    }

    function evaluateRPN(rpn) {
      const stack = [];
      for (let i=0;i<rpn.length;i++) {
        const t = rpn[i];
        if (t.type === 'number') stack.push(t.value);
        else if (t.type === 'operator') {
          const op = t.value;
          if (op === 'u-') {
            if (stack.length <1) throw new Error('Missing operand for unary minus');
            const a = stack.pop(); stack.push(-a);
          } else if (op === '%') {
            if (stack.length <1) throw new Error('% missing operand');
            const b = stack.pop();
            if (t.mode === 'relative') {
              if (stack.length <1) stack.push(b/100.0);
              else {
                const a = stack[stack.length -1];
                stack.push(a * b / 100.0);
              }
            } else stack.push(b/100.0);
          } else if (op === '!') {
            if (stack.length <1) throw new Error('! missing operand');
            const a = stack.pop();
            stack.push(factorialValue(a));
          } else {
            if (stack.length <2) throw new Error('Missing operands');
            const b = stack.pop(), a = stack.pop();
            let res;
            if (op === '+') res = a + b;
            else if (op === '-') res = a - b;
            else if (op === '*') res = a * b;
            else if (op === '/') { if (b === 0) throw new Error('Division by zero'); res = a / b; }
            else if (op === '^') res = Math.pow(a,b);
            else throw new Error('Unknown operator ' + op);
            stack.push(res);
          }
        } else if (t.type === 'func') {
          if (stack.length <1) throw new Error('Missing argument for ' + t.value);
          const a = stack.pop();
          let res;
          const name = t.value;
          const toRad = x => degMode ? (x * Math.PI / 180) : x;
          const fromRad = x => degMode ? (x * 180 / Math.PI) : x;
          switch (name) {
            case 'sin': res = Math.sin(toRad(a)); break;
            case 'cos': res = Math.cos(toRad(a)); break;
            case 'tan': res = Math.tan(toRad(a)); break;
            case 'asin': res = fromRad(Math.asin(a)); break;
            case 'acos': res = fromRad(Math.acos(a)); break;
            case 'atan': res = fromRad(Math.atan(a)); break;
            case 'sinh': res = Math.sinh ? Math.sinh(a) : (Math.exp(a)-Math.exp(-a))/2; break;
            case 'cosh': res = Math.cosh ? Math.cosh(a) : (Math.exp(a)+Math.exp(-a))/2; break;
            case 'tanh': res = Math.tanh ? Math.tanh(a) : (Math.sinh ? Math.sinh(a)/Math.cosh(a) : (Math.exp(a)-Math.exp(-a))/(Math.exp(a)+Math.exp(-a))); break;
            case 'asinh': res = Math.asinh ? Math.asinh(a) : Math.log(a + Math.sqrt(a*a + 1)); break;
            case 'acosh': res = Math.acosh ? Math.acosh(a) : Math.log(a + Math.sqrt(a*a - 1)); break;
            case 'atanh': res = Math.atanh ? Math.atanh(a) : 0.5*Math.log((1+a)/(1-a)); break;
            case 'sqrt': res = Math.sqrt(a); break;
            case 'ln': res = Math.log(a); break;
            case 'log10': res = Math.log10 ? Math.log10(a) : Math.log(a)/Math.LN10; break;
            case 'abs': res = Math.abs(a); break;
            case 'exp': res = Math.exp(a); break;
            default: throw new Error('Unknown function ' + name);
          }
          stack.push(res);
        } else {
          throw new Error('Unknown RPN token');
        }
      }
      if (stack.length !== 1) throw new Error('Invalid expression');
      return stack[0];
    }

    function formatResult(n) {
      if (!isFinite(n)) throw new Error('Non-finite result');
      if (Math.abs(n - Math.round(n)) < 1e-12) return String(Math.round(n));
      return parseFloat(n.toPrecision(12)).toString();
    }

    function compute() {
      if (!buffer) return;
      try {
        const raw = rawTokenize(buffer);
        const withImplicit = insertImplicitMultiplication(raw);
        setPercentModes(withImplicit);
        const rpn = shuntingYard(withImplicit);
        const result = evaluateRPN(rpn);
        lastAnswer = result;
        addHistory(buffer, formatResult(result));
        buffer = formatResult(result);
        setStatus('OK');
        updateDisplay();
      } catch (err) {
        setStatus('Error: ' + (err && err.message ? err.message : String(err)), true);
        displayEl.textContent = 'Error';
        buffer = '';
        console.error(err);
        setTimeout(()=>{ setStatus('Ready'); updateDisplay(); }, 1600);
      }
    }

    // UI wiring
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-value');
        const action = btn.getAttribute('data-action');
        const func = btn.getAttribute('data-func');

        if (action === 'clear') clearAll();
        else if (action === 'back') backspace();
        else if (action === 'equals') compute();
        else if (action === 'const') {
          const v = btn.getAttribute('data-value');
          if (v === 'pi') appendValue('π');
          else if (v === 'e') appendValue('e');
        }
        else if (action === 'ans') { if (lastAnswer !== null) appendValue(String(lastAnswer)); }
        else if (action === 'pow2') appendValue('^2');
        else if (action === 'fact') appendValue('!');
        else if (action === 'exp') appendValue('exp(');
        else if (func) appendValue(func + '(');
        else if (val) {
          if (val === '+' || val === '-' || val === '×' || val === '÷' || val === '%') {
            const mapped = val === '-' ? '−' : val;
            applyOperator(mapped);
          } else appendValue(val);
        }
      });
    });

    toggleSci.addEventListener('click', () => {
      const hidden = sciPanel.classList.toggle('hidden');
      sciPanel.setAttribute('aria-hidden', String(hidden));
      toggleSci.setAttribute('aria-pressed', String(!hidden));
      toggleSci.textContent = hidden ? 'Scientific' : 'Basic';
    });

    toggleDeg.addEventListener('click', () => {
      degMode = !degMode;
      toggleDeg.setAttribute('aria-pressed', String(degMode));
      toggleDeg.textContent = degMode ? 'Deg' : 'Rad';
      setStatus(degMode ? 'Degrees' : 'Radians');
      setTimeout(()=>setStatus('Ready'), 900);
    });

    // Memory buttons
    function safeNumberFromDisplay() {
      if (!buffer) return 0;
      try {
        // attempt parse by computing current buffer (non-destructive)
        const raw = rawTokenize(buffer);
        const withImplicit = insertImplicitMultiplication(raw);
        setPercentModes(withImplicit);
        const rpn = shuntingYard(withImplicit);
        return evaluateRPN(rpn);
      } catch {
        // fallback parse float on buffer
        const n = parseFloat(buffer);
        return Number.isFinite(n) ? n : 0;
      }
    }
    mPlusBtn.addEventListener('click', () => { memory += safeNumberFromDisplay(); updateMemoryUI(); });
    mMinusBtn.addEventListener('click', () => { memory -= safeNumberFromDisplay(); updateMemoryUI(); });
    mRecallBtn.addEventListener('click', () => { buffer += String(memory); updateDisplay(); });
    mClearBtn.addEventListener('click', () => { memory = 0; updateMemoryUI(); });

    // Keyboard handling
    window.addEventListener('keydown', (e) => {
      const key = e.key;
      const isShift = e.shiftKey, isCtrl = e.ctrlKey, isAlt = e.altKey;
      // memory shortcuts
      if ((key === 'm' || key === 'M') && !isCtrl && !isAlt && !isShift) { e.preventDefault(); mRecallBtn.click(); return; }
      if ((key === 'M') && isShift && !isCtrl && !isAlt) { e.preventDefault(); mPlusBtn.click(); return; }
      if ((key === 'm' || key === 'M') && isCtrl && !isAlt) { e.preventDefault(); mMinusBtn.click(); return; }
      if ((key === 'm' || key === 'M') && isAlt) { e.preventDefault(); mClearBtn.click(); return; }

      if ((/^[0-9]$/).test(key)) { appendValue(key); return; }
      if (key === '.') { appendValue('.'); return; }
      if (key === 'Backspace') { backspace(); return; }
      if (key === 'Escape') { clearAll(); return; }
      if (key === 'Enter' || key === '=') { e.preventDefault(); compute(); return; }
      if (key === '+') { applyOperator('+'); return; }
      if (key === '-') { applyOperator('−'); return; }
      if (key === '*') { applyOperator('×'); return; }
      if (key === '/') { applyOperator('÷'); return; }
      if (key === '%') { applyOperator('%'); return; }
      if (key === '(') { appendValue('('); return; }
      if (key === ')') { appendValue(')'); return; }
      if (key === '^') { appendValue('^'); return; }
      if (key === '!') { appendValue('!'); return; }
      if (key === 'h') { // toggle history
        // scroll focus to history
        const side = document.querySelector('.side');
        side.scrollIntoView({behavior:'smooth'}); return;
      }
      if (key === 'c') { copyCurrent(); return; }
      if (key === 'z') { toggleSci.click(); return; }
      if (key === 'd') { toggleDeg.click(); return; }
    });

    // copy button
    function copyCurrent() {
      const txt = displayEl.textContent || '';
      navigator.clipboard.writeText(txt).then(()=> setStatus('Copied')).catch(()=> setStatus('Copy failed', true));
      setTimeout(()=>setStatus('Ready'), 800);
    }
    copyBtn.addEventListener('click', copyCurrent);

    // history clear
    clearHistoryBtn.addEventListener('click', () => { history.length = 0; renderHistory(); });

    // initial UI
    updateDisplay();
    updateMemoryUI();
    setStatus('Ready');

    // expose compute for console testing
    window._calc = { compute, rawTokenize };

  })();
  </script>
</body>
</html>
