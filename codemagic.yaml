workflows:
  bankchase-web:
    name: BankChase web
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22.14.0
    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint
        script: pnpm lint
      - name: Build Next.js application
        script: pnpm build
    artifacts:
      - .next/**
    publishing:
      email:
        recipients:
          - $CM_EMAIL_RECIPIENT
        notify:
          success: true
          failure: true
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

# Configure CM_EMAIL_RECIPIENT in Codemagic as a verified recipient.
# External recipients must confirm Codemagic's opt-in email.
# Successful builds include artifact links; failed builds include log links.
# Do not delete .next before Codemagic collects artifacts.
